<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: #ffffff;
            color: #333;
            line-height: 1.6
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            font-weight: 300;
            margin-bottom: 10px
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem
        }

        .controls {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            margin-bottom: 30px
        }

        .filter-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center
        }

        .filter-item {
            flex: 1;
            min-width: 200px
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500
        }

        input,
        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: all .3s ease;
            background: #fafbfc
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4a90e2;
            background: #fff
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            transition: all .3s ease;
            border: 1px solid #e0e6ed
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .12)
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50
        }

        .card-type {
            background: #4a90e2;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 500
        }

        .card-desc {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6
        }

        .card-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: .9rem
        }

        .stat-icon {
            font-weight: 600;
            color: #4a90e2
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2rem
        }

        /* 隐藏上传区域 */
        .import-section {
            display: none
        }

        @media(max-width:768px) {
            .filter-group {
                flex-direction: column
            }

            .filter-item {
                width: 100%
            }

            h1 {
                font-size: 2rem
            }
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }

        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }

        .checkbox-group input {
            margin-right: 4px;
        }

        /* 稀有度颜色：按“运动分类挑战”图片配色 */
        .rarity-common      { background: #C7C7C7; } /* 灰色 → 平移 */
        .rarity-special     { background: #4DFFFF; } /* 亮青 → 旋转 */
        .rare               { background: #3B8BFF; } /* 亮蓝 → 滚动 */
        .epic               { background: #FF8A00; } /* 橙色 → 摆动 */
        .legendary          { background: #E6E600; } /* 黄色 → 振动 */
        .mythic             { background: #FF4DFF; } /* 紫色 → 保留 */

        /* Tag 样式：参考图片“正确/错误/剩余” */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 6px;
            margin-bottom: 4px;
        }
        .tag.correct {
            background: #52c41a;
            color: #fff;
        }
        .tag.incorrect {
            background: #ff4d4f;
            color: #fff;
        }
        .tag.remaining {
            background: #faad14;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>卡牌图鉴</h1>
            <p class="subtitle">浏览和管理你的卡牌收藏</p>
        </header>

        <!-- 上传区域已隐藏，可整段删掉，这里仅隐藏保持 diff 最小 -->
        <div class="import-section">
            <p>（已禁用上传，默认读取仓库 card.json）</p>
        </div>

        <div class="controls">
            <div class="filter-group">
                <div class="filter-item">
                    <label for="searchInput">搜索卡牌</label>
                    <input type="text" id="searchInput" placeholder="输入卡牌名称或描述...">
                </div>
                <div class="filter-item">
                    <label for="typeFilter">类型筛选</label>
                    <select id="typeFilter">
                        <option value="">全部类型</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="roleFilter">职业筛选</label>
                    <select id="roleFilter">
                        <option value="">全部职业</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>标签筛选（多选）</label>
                    <div id="tagFilters" class="checkbox-group"></div>
                </div>

                <div class="filter-item">
                    <label>稀有度筛选（多选）</label>
                    <div id="rarityFilters" class="checkbox-group"></div>
                </div>
            </div>
        </div>

        <div id="cardsContainer" class="cards-grid">
            <div class="no-results">正在加载 card.json …</div>
        </div>
    </div>

    <script>
        /* ============ 字典表 ============ */
        const CardType = {
            attack: "攻击", equipment: "装备", magic: "法术", spell: "咒语", pet: "宠物",
            weapon: "武器", shield: "盾牌", food: "食物", accessories: "饰品", magicbook: "魔法书",
            armor: "护甲", potion: "药水", magicScroll: "魔法卷轴", skill: "技能", career: "职业"
        };
        const CardRarity = {
            common: "普通", special: "特殊", exclusive: "专属", rare: "罕见",
            epic: "史诗", legendary: "传说", mythic: "神话"
        };
        /* 按运动方式配色，CSS 对应 class */
        const rarityClass = {
            common: "rarity-common",
            special: "rarity-special",
            rare: "rare",
            epic: "epic",
            legendary: "legendary",
            mythic: "mythic"
        };
        const CardCareer = { all: "通用", warrior: "战士" ,mage:"法师"};
        const Tag = { ice: "冰系", book: "书" };   // 以后继续往这里加

        /* ============ 数据容器 ============ */
        let cardsData = {};
        let filteredCards = {};

        /* ============ 入口：读 card.json（无缓存） ============ */
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`card.json?t=${Date.now()}`)
                .then(r => r.json())
                .then(json => {
                    cardsData = json;
                    initFilters();
                    displayCards(cardsData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('cardsContainer').innerHTML =
                        '<div class="no-results">读取 card.json 失败</div>';
                });
        });

        /* ============ 初始化下拉 & 多选 ============ */
        function initFilters() {
            /* ---- 类型下拉 ---- */
            const typeFilter = document.getElementById('typeFilter');
            typeFilter.innerHTML = '<option value="">全部类型</option>';
            const types = [...new Set(Object.values(cardsData).map(c => c.type).filter(Boolean))];
            types.forEach(t => {
                const o = document.createElement('option');
                o.value = t;
                o.textContent = CardType[t] || t;
                typeFilter.appendChild(o);
            });

            /* ---- 职业下拉 ---- */
            const roleFilter = document.getElementById('roleFilter');
            roleFilter.innerHTML = '<option value="">全部职业</option>';
            const roles = [...new Set(Object.values(cardsData).flatMap(c => c.career || ['all']))];
            roles.forEach(r => {
                const o = document.createElement('option');
                o.value = r;
                o.textContent = CardCareer[r] || r;
                roleFilter.appendChild(o);
            });

            /* ---- 标签多选 ---- */
            const tagBox = document.getElementById('tagFilters');
            const allTags = [...new Set(Object.values(cardsData).flatMap(c => c.tag || []))];
            allTags.forEach(t => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${t}" onchange="filterCards()"> ${Tag[t] || t}`;
                tagBox.appendChild(label);
            });

            /* ---- 稀有度多选 ---- */
            const rarityBox = document.getElementById('rarityFilters');
            Object.keys(CardRarity).forEach(r => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${r}" onchange="filterCards()"> ${CardRarity[r]}`;
                rarityBox.appendChild(label);
            });
        }

        /* ============ 筛选逻辑 ============ */
        function filterCards() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const typeF = document.getElementById('typeFilter').value;
            const roleF = document.getElementById('roleFilter').value;

            /* 收集选中的标签 */
            const checkedTags = [...document.querySelectorAll('#tagFilters input:checked')].map(i => i.value);
            /* 收集选中的稀有度 */
            const checkedRarities = [...document.querySelectorAll('#rarityFilters input:checked')].map(i => i.value);

            filteredCards = {};
            Object.entries(cardsData).forEach(([k, c]) => {
                if (search && !c.name.toLowerCase().includes(search) && !c.desc.toLowerCase().includes(search)) return;
                if (typeF && c.type !== typeF) return;
                if (roleF && (!c.career || !c.career.includes(roleF))) return;

                /* 标签多选：勾选时至少命中一个即可（交集） */
                if (checkedTags.length) {
                    const cardTags = c.tag || [];
                    if (!checkedTags.some(t => cardTags.includes(t))) return;
                }
                /* 稀有度多选 */
                if (checkedRarities.length) {
                    if (!checkedRarities.includes(c.rarity || 'common')) return;
                }

                filteredCards[k] = c;
            });
            displayCards(filteredCards);
        }

        /* ============ 渲染 ============ */
        function displayCards(cards) {
            const box = document.getElementById('cardsContainer');
            box.innerHTML = '';
            if (Object.keys(cards).length === 0) {
                box.innerHTML = '<div class="no-results">没有找到匹配的卡牌</div>';
                return;
            }
            Object.entries(cards).forEach(([k, c]) => box.appendChild(createCard(k, c)));
        }

        function createCard(key, c) {
            const div = document.createElement('div');
            div.className = 'card';

            const typeTxt = CardType[c.type] || c.type || '无类型';
            const rarity = c.rarity || 'common';
            const typeColor = CardColor[rarity] || '#999';

            /* 职业中文 */
            const careerTxt = (c.career || ['all'])
                .map(id => CardCareer[id] || id)
                .join(', ');

            /* 标签中文 + 样式 */
            const tagTxt = (c.tag || [])
                .map(t => `<span class="tag remaining">${Tag[t] || t}</span>`)
                .join('');

            /* 统计行 */
            const stats = [];
            if (c.damage != null) stats.push(`⚔ 伤害 ${c.damage}`);
            if (c.hit != null) stats.push(`🎯 命中 ${c.hit}`);
            if (c.cooldown != null) stats.push(`❄ 冷却 ${c.cooldown}s`);
            if (c.mp != null) stats.push(`🔮 法力 ${c.mp}`);
            if (c.ap != null) stats.push(`⚡ 行动力 ${c.ap}`);
            if (c.gold != null) stats.push(`💰 价值 ${c.gold}`);

            div.innerHTML = `
        <div class="card-header">
            <h3 class="card-name">${c.name}</h3>
            <span class="card-type ${rarityClass[rarity]}">${typeTxt}</span>
        </div>
        <p class="card-desc">${c.desc}</p>
        ${tagTxt ? `<p class="card-tags">🏷 标签：${tagTxt}</p>` : ''}
        <div class="card-stats">
            ${stats.map(s => `<div class="stat"><span class="stat-icon">${s}</span></div>`).join('')}
            <div class="stat"><span class="stat-icon">👤</span> 职业：${careerTxt}</div>
        </div>`;
            return div;
        }

        /* ============ 事件绑定 ============ */
        document.getElementById('searchInput').addEventListener('input', filterCards);
        document.getElementById('typeFilter').addEventListener('change', filterCards);
        document.getElementById('roleFilter').addEventListener('change', filterCards);
    </script>
</body>
</html>
