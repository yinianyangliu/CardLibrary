<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌图鉴 · 运动风</title>
    <style>
        /* ========= 运动挑战风格 ========= */
        :root{
            --bg:#fff8e1;               /* 米黄背景 */
            --primary:#ff6f00;          /* 活力橙 */
            --secondary:#1976d2;        /* 竞技蓝 */
            --text:#3e2723;             /* 深棕文字 */
            --radius:12px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family: "PingFang SC","Helvetica Neue",Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:20px;
            min-height:100vh;
        }
        header{
            width:100%;
            max-width:800px;
            text-align:center;
            margin-bottom:30px;
        }
        h1{
            font-size:2.8rem;
            color:var(--primary);
            letter-spacing:2px;
            text-shadow:2px 2px 0 #fff;
        }
        .subtitle{
            font-size:1.2rem;
            color:var(--secondary);
            margin-top:8px;
        }

        /* ---- 控制条 ---- */
        .controls{
            width:100%;
            max-width:800px;
            background:#fff;
            border:3px solid var(--primary);
            border-radius:var(--radius);
            padding:20px 25px;
            margin-bottom:25px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
        }
        .filter-group{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            align-items:center;
        }
        .filter-item{
            flex:1 1 200px;
        }
        label{
            font-weight:700;
            margin-bottom:6px;
            display:block;
            color:var(--secondary);
        }
        input,select{
            width:100%;
            padding:10px 14px;
            border:2px solid var(--primary);
            border-radius:var(--radius);
            font-size:15px;
            background:#fff9e6;
            transition:border .2s;
        }
        input:focus,select:focus{
            outline:none;
            border-color:var(--secondary);
        }

        /* ---- 多选框 ---- */
        .checkbox-group{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:6px;
        }
        .checkbox-group label{
            display:inline-flex;
            align-items:center;
            background:#fff3c4;
            padding:4px 10px;
            border-radius:20px;
            font-size:14px;
            cursor:pointer;
            border:2px solid transparent;
            transition:all .2s;
        }
        .checkbox-group label:has(input:checked){
            border-color:var(--primary);
            background:var(--primary);
            color:#fff;
        }
        .checkbox-group input{
            margin-right:5px;
        }

        /* ---- 卡牌网格 ---- */
        .cards-grid{
            width:100%;
            max-width:800px;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:20px;
        }
        .card{
            background:#fff;
            border:3px solid var(--primary);
            border-radius:var(--radius);
            padding:18px 20px;
            box-shadow:4px 4px 0 0 var(--secondary);
            transition:transform .2s;
            position:relative;
        }
        .card:hover{
            transform:translate(-4px,-4px);
            box-shadow:8px 8px 0 0 var(--secondary);
        }
        .card-header{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            margin-bottom:12px;
        }
        .card-name{
            font-size:1.4rem;
            font-weight:700;
            color:var(--primary);
        }
        .card-type{
            background:var(--secondary);
            color:#fff;
            padding:4px 12px;
            border-radius:20px;
            font-size:.85rem;
            font-weight:600;
        }
        .card-desc{
            margin-bottom:12px;
            line-height:1.6;
        }
        .card-tags{
            font-size:.9rem;
            margin-bottom:10px;
            color:#555;
        }
        .card-stats{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            font-size:.9rem;
        }
        .stat{
            background:#fff3c4;
            padding:4px 8px;
            border-radius:6px;
            font-weight:600;
            color:var(--text);
        }
        .no-results{
            text-align:center;
            padding:60px 20px;
            font-size:1.2rem;
            color:var(--secondary);
        }

        @media(max-width:600px){
            h1{font-size:2.2rem}
            .filter-group{flex-direction:column}
        }
    </style>
</head>
<body>
    <header>
        <h1>卡牌图鉴</h1>
        <p class="subtitle">—— 运动风挑战版 ——</p>
    </header>

    <div class="controls">
        <div class="filter-group">
            <div class="filter-item">
                <label for="searchInput">搜索卡牌</label>
                <input type="text" id="searchInput" placeholder="输入卡牌名称或描述...">
            </div>
            <div class="filter-item">
                <label for="typeFilter">类型筛选</label>
                <select id="typeFilter">
                    <option value="">全部类型</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="roleFilter">职业筛选</label>
                <select id="roleFilter">
                    <option value="">全部职业</option>
                </select>
            </div>
            <div class="filter-item">
                <label>标签筛选（多选）</label>
                <div id="tagFilters" class="checkbox-group"></div>
            </div>
            <div class="filter-item">
                <label>稀有度筛选（多选）</label>
                <div id="rarityFilters" class="checkbox-group"></div>
            </div>
        </div>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="no-results">正在加载 card.json …</div>
    </div>

    <script>
        /* ============ 字典表 ============ */
        const CardType = {
            attack:"攻击", equipment:"装备", magic:"法术", spell:"咒语", pet:"宠物",
            weapon:"武器", shield:"盾牌", food:"食物", accessories:"饰品", magicbook:"魔法书",
            armor:"护甲", potion:"药水", magicScroll:"魔法卷轴", skill:"技能", career:"职业"
        };
        const CardRarity = {
            common:"普通", special:"特殊", exclusive:"专属", rare:"罕见",
            epic:"史诗", legendary:"传说", mythic:"神话"
        };
        const CardColor = {
            common:"#C7C7C7", special:"#4DFFFF", exclusive:"#10FF10",
            rare:"#3B8BFF", epic:"#FF8A00", legendary:"#E6E600", mythic:"#FF4DFF"
        };
        const CardCareer = { all:"通用", warrior:"战士" };
        const Tag = { ice:"冰系", book:"书" };

        let cardsData = {};
        let filteredCards = {};

        /* ============ 入口 ============ */
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`card.json?t=${Date.now()}`)
                .then(r => r.json())
                .then(json => {
                    cardsData = json;
                    initFilters();
                    displayCards(cardsData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('cardsContainer').innerHTML =
                        '<div class="no-results">读取 card.json 失败</div>';
                });
        });

        /* ============ 初始化下拉 & 多选 ============ */
        function initFilters() {
            /* 类型下拉 */
            const typeFilter = document.getElementById('typeFilter');
            typeFilter.innerHTML = '<option value="">全部类型</option>';
            const types = [...new Set(Object.values(cardsData).map(c => c.type).filter(Boolean))];
            types.forEach(t => {
                const o = document.createElement('option');
                o.value = t;
                o.textContent = CardType[t] || t;
                typeFilter.appendChild(o);
            });

            /* 职业下拉 */
            const roleFilter = document.getElementById('roleFilter');
            roleFilter.innerHTML = '<option value="">全部职业</option>';
            const roles = [...new Set(Object.values(cardsData).flatMap(c => c.career || ['all']))];
            roles.forEach(r => {
                const o = document.createElement('option');
                o.value = r;
                o.textContent = CardCareer[r] || r;
                roleFilter.appendChild(o);
            });

            /* 标签多选 */
            const tagBox = document.getElementById('tagFilters');
            const allTags = [...new Set(Object.values(cardsData).flatMap(c => c.tag || []))];
            allTags.forEach(t => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${t}" onchange="filterCards()"> ${Tag[t] || t}`;
                tagBox.appendChild(label);
            });

            /* 稀有度多选 */
            const rarityBox = document.getElementById('rarityFilters');
            Object.keys(CardRarity).forEach(r => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${r}" onchange="filterCards()"> ${CardRarity[r]}`;
                rarityBox.appendChild(label);
            });
        }

        /* ============ 筛选逻辑 ============ */
        function filterCards() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const typeF = document.getElementById('typeFilter').value;
            const roleF = document.getElementById('roleFilter').value;

            const checkedTags = [...document.querySelectorAll('#tagFilters input:checked')].map(i => i.value);
            const checkedRarities = [...document.querySelectorAll('#rarityFilters input:checked')].map(i => i.value);

            filteredCards = {};
            Object.entries(cardsData).forEach(([k, c]) => {
                if (search && !c.name.toLowerCase().includes(search) && !c.desc.toLowerCase().includes(search)) return;
                if (typeF && c.type !== typeF) return;
                if (roleF && (!c.career || !c.career.includes(roleF))) return;

                if (checkedTags.length) {
                    const cardTags = c.tag || [];
                    if (!checkedTags.some(t => cardTags.includes(t))) return;
                }
                if (checkedRarities.length) {
                    if (!checkedRarities.includes(c.rarity || 'common')) return;
                }

                filteredCards[k] = c;
            });
            displayCards(filteredCards);
        }

        /* ============ 渲染 ============ */
        function displayCards(cards) {
            const box = document.getElementById('cardsContainer');
            box.innerHTML = '';
            if (Object.keys(cards).length === 0) {
                box.innerHTML = '<div class="no-results">没有找到匹配的卡牌</div>';
                return;
            }
            Object.entries(cards).forEach(([k, c]) => box.appendChild(createCard(k, c)));
        }

        function createCard(key, c) {
            const div = document.createElement('div');
            div.className = 'card';

            const typeTxt = CardType[c.type] || c.type || '无类型';
            const rarity = c.rarity || 'common';
            const typeColor = CardColor[rarity] || '#999';

            const careerTxt = (c.career || ['all'])
                .map(id => CardCareer[id] || id)
                .join(', ');

            const tagTxt = (c.tag || [])
                .map(t => Tag[t] || t)
                .join(', ');

            const stats = [];
            if (c.damage != null) stats.push(`⚔ 伤害 ${c.damage}`);
            if (c.hit != null) stats.push(`🎯 命中 ${c.hit}`);
            if (c.cooldown != null) stats.push(`❄ 冷却 ${c.cooldown}s`);
            if (c.mp != null) stats.push(`🔮 法力 ${c.mp}`);
            if (c.ap != null) stats.push(`⚡ 行动力 ${c.ap}`);
            if (c.gold != null) stats.push(`💰 价值 ${c.gold}`);

            div.innerHTML = `
        <div class="card-header">
            <h3 class="card-name">${c.name}</h3>
            <span class="card-type" style="background:${typeColor}">${typeTxt}</span>
        </div>
        <p class="card-desc">${c.desc}</p>
        ${tagTxt ? `<p class="card-tags">🏷 标签：${tagTxt}</p>` : ''}
        <div class="card-stats">
            ${stats.map(s => `<div class="stat">${s}</div>`).join('')}
            <div class="stat">👤 职业：${careerTxt}</div>
        </div>`;
            return div;
        }

        /* ============ 事件绑定 ============ */
        document.getElementById('searchInput').addEventListener('input', filterCards);
        document.getElementById('typeFilter').addEventListener('change', filterCards);
        document.getElementById('roleFilter').addEventListener('change', filterCards);
    </script>
</body>
</html>
