<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌展示</title>
    <style>
        /* ===== 样式保持原样，仅把 .import-section 隐藏 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            font-weight: 300;
            margin-bottom: 10px
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem
        }

        .controls {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            margin-bottom: 30px
        }

        .filter-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center
        }

        .filter-item {
            flex: 1;
            min-width: 200px
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500
        }

        input,
        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: all .3s ease;
            background: #fafbfc
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4a90e2;
            background: #fff
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            transition: all .3s ease;
            border: 1px solid #e0e6ed
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .12)
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50
        }

        .card-type {
            background: #4a90e2;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 500
        }

        .card-desc {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6
        }

        .card-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: .9rem
        }

        .stat-icon {
            font-weight: 600;
            color: #4a90e2
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2rem
        }

        /* 隐藏上传区域 */
        .import-section {
            display: none
        }

        @media(max-width:768px) {
            .filter-group {
                flex-direction: column
            }

            .filter-item {
                width: 100%
            }

            h1 {
                font-size: 2rem
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>卡牌图鉴</h1>
            <p class="subtitle">浏览和管理你的卡牌收藏</p>
        </header>

        <!-- 上传区域已隐藏，可整段删掉，这里仅隐藏保持 diff 最小 -->
        <div class="import-section">
            <p>（已禁用上传，默认读取仓库 card.json）</p>
        </div>

        <div class="controls">
            <div class="filter-group">
                <div class="filter-item">
                    <label for="searchInput">搜索卡牌</label>
                    <input type="text" id="searchInput" placeholder="输入卡牌名称或描述...">
                </div>
                <div class="filter-item">
                    <label for="typeFilter">类型筛选</label>
                    <select id="typeFilter">
                        <option value="">全部类型</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="roleFilter">职业筛选</label>
                    <select id="roleFilter">
                        <option value="">全部职业</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="cardsContainer" class="cards-grid">
            <div class="no-results">正在加载 card.json …</div>
        </div>
    </div>

    <script>
        /* ============ 字典表 ============ */
        const CardType = {
            attack: "攻击", equipment: "装备", magic: "法术", spell: "咒语", pet: "宠物",
            weapon: "武器", shield: "盾牌", food: "食物", accessories: "饰品", magicbook: "魔法书",
            armor: "护甲", potion: "药水", magicScroll: "魔法卷轴", skill: "技能", career: "职业"
        };
        const CardRarity = {
            common: "普通", special: "特殊", exclusive: "专属", rare: "罕见",
            epic: "史诗", legendary: "传说", mythic: "神话"
        };
        const CardColor = {
            common: "#C7C7C7", special: "#4DFFFF", exclusive: "#10FF10",
            rare: "#3B8BFF", epic: "#FF8A00", legendary: "#E6E600", mythic: "#FF4DFF"
        };
        const CardCareer = { all: "通用", warrior: "战士" };

        /* ============ 数据容器 ============ */
        let cardsData = {};
        let filteredCards = {};

        /* ============ 入口：读 card.json ============ */
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`card.json?t=${Date.now()}`)        // 或者 {cache:'no-store'}
                .then(r => r.json())
                .then(json => {
                    cardsData = json;
                    initFilters();
                    displayCards(cardsData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('cardsContainer').innerHTML =
                        '<div class="no-results">读取 card.json 失败</div>';
                });
        });

        /* ============ 初始化下拉框 ============ */
        function initFilters() {
            const typeFilter = document.getElementById('typeFilter');
            const roleFilter = document.getElementById('roleFilter');
            typeFilter.innerHTML = '<option value="">全部类型</option>';
            roleFilter.innerHTML = '<option value="">全部职业</option>';

            const types = new Set();
            const roles = new Set();

            Object.values(cardsData).forEach(c => {
                if (c.type) types.add(c.type);
                if (c.career) c.career.forEach(r => roles.add(r));
            });

            [...types].sort().forEach(t => {
                const o = document.createElement('option');
                o.value = t;
                o.textContent = CardType[t] || t;
                typeFilter.appendChild(o);
            });
            [...roles].sort().forEach(r => {
                const o = document.createElement('option');
                o.value = r;
                o.textContent = CardCareer[r] || r;
                roleFilter.appendChild(o);
            });
        }

        /* ============ 筛选 ============ */
        function filterCards() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const typeF = document.getElementById('typeFilter').value;
            const roleF = document.getElementById('roleFilter').value;

            filteredCards = {};
            Object.entries(cardsData).forEach(([k, c]) => {
                if (search && !c.name.toLowerCase().includes(search) &&
                    !c.desc.toLowerCase().includes(search)) return;
                if (typeF && c.type !== typeF) return;
                if (roleF && (!c.career || !c.career.includes(roleF))) return;
                filteredCards[k] = c;
            });
            displayCards(filteredCards);
        }

        /* ============ 渲染 ============ */
        function displayCards(cards) {
            const box = document.getElementById('cardsContainer');
            box.innerHTML = '';
            if (Object.keys(cards).length === 0) {
                box.innerHTML = '<div class="no-results">没有找到匹配的卡牌</div>';
                return;
            }
            Object.entries(cards).forEach(([k, c]) => box.appendChild(createCard(k, c)));
        }

        function createCard(key, c) {
            const div = document.createElement('div');
            div.className = 'card';

            /* 顶部标签：中文类型 + 稀有度背景色 */
            const typeTxt = CardType[c.type] || c.type || '无类型';
            const rarity = c.rarity || 'common';
            const typeColor = CardColor[rarity] || '#999';

            /* 职业中文 */
            const careerTxt = (c.career || ['all'])
                .map(id => CardCareer[id] || id)
                .join(', ');

            /* 统计行：有字段才显示 */
            const stats = [];
            if (c.damage != null) stats.push(`⚔ 伤害 ${c.damage}`);
            if (c.hit != null) stats.push(`🎯 命中 ${c.hit}`);
            if (c.cooldown != null) stats.push(`❄ 冷却 ${c.cooldown}s`);
            if (c.mp != null) stats.push(`🔮 法力 ${c.mp}`);
            if (c.ap != null) stats.push(`⚡ 行动力 ${c.ap}`);
            if (c.gold != null) stats.push(`💰 价值 ${c.gold}`);

            div.innerHTML = `
        <div class="card-header">
            <h3 class="card-name">${c.name}</h3>
            <span class="card-type" style="background:${typeColor}">${typeTxt}</span>
        </div>
        <p class="card-desc">${c.desc}</p>
        <div class="card-stats">
            ${stats.map(s => `<div class="stat"><span class="stat-icon">${s}</span></div>`).join('')}
            <div class="stat"><span class="stat-icon">👤</span> 职业: ${careerTxt}</div>
        </div>`;
            return div;
        }

        /* ============ 事件绑定 ============ */
        document.getElementById('searchInput').addEventListener('input', filterCards);
        document.getElementById('typeFilter').addEventListener('change', filterCards);
        document.getElementById('roleFilter').addEventListener('change', filterCards);
    </script>
</body>

</html>
